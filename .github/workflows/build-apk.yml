name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: 解压工程zip
        run: |
          unzip -o "$(ls *.zip | head -1)" -d /tmp/proj
          echo "PROJ_DIR=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - name: 编译APK
        run: cd "$PROJ_DIR" && gradle assembleDebug --no-daemon
      - name: 收集APK
        run: cp "$PROJ_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zhalema-apk
          path: app-debug.apk
